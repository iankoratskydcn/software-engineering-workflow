<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Software Engineering Workflow</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { margin: 0; background: #141414; color: #e6e6e6; }
  .mono { font-family: "SF Mono", Consolas, Monaco, monospace; }
  #app { min-height: 100vh; padding: 24px 32px 60px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 20px; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; font-size: 12px; color: #888; }
  button, .btn { background: #1e1e1e; border: 1px solid #444; border-radius: 4px; color: #e6e6e6; font-size: 12px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #262626; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #2c2c2c; margin-bottom: 24px; overflow-x: auto; }
  .tab { padding: 10px 16px; font-size: 13px; color: #999; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.active { color: #fff; font-weight: 600; border-bottom-color: #3b82f6; }
  .grid { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } #app { padding: 16px; } }
  input[type=text] { width: 100%; background: #1e1e1e; border: 1px solid #444; border-radius: 4px; color: #e6e6e6; font-size: 13px; padding: 8px 10px; }
  .panel { border: 1px solid #2c2c2c; border-radius: 2px; background: #1a1a1a; padding: 14px; }
  .row { padding: 6px 8px; font-size: 12px; color: #ddd; cursor: pointer; border-radius: 2px; border: 1px solid transparent; }
  .row:hover { background: #222; }
  .row.sel { border-color: #3b82f6; background: #1c2230; }
  .path { font-size: 9px; color: #666; }
  .pill { font-size: 9px; letter-spacing: .05em; text-transform: uppercase; border: 1px solid; padding: 1px 8px; border-radius: 999px; width: fit-content; display: inline-block; margin-bottom: 8px; }
  .muted { color: #777; font-size: 12px; }
  .err { color: #e5484d; font-size: 12px; margin: 4px 0; }
  .warn { color: #e0a030; font-size: 12px; margin: 4px 0; }
  .indent { margin-left: 18px; }
  .digest h2 { font-size: 15px; margin: 22px 0 6px; } .digest h3 { font-size: 13px; margin: 14px 0 4px; color: #bbb; }
  .digest h4 { font-size: 12px; margin: 10px 0 4px; color: #999; font-weight: 600; }
  ul { margin: 4px 0 8px; padding-left: 20px; font-size: 12px; color: #ccc; }
  pre { white-space: pre-wrap; font-size: 12px; color: #ccc; margin: 8px 0; }
  .empty { border: 1px dashed #333; padding: 60px 20px; text-align: center; color: #777; font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <h1>Software Engineering Workflow</h1>
  <div class="bar">
    <button id="open">Open repo folder</button>
    <input id="fallback-input" type="file" webkitdirectory hidden>
    <span id="status">No folder open.</span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<script>
'use strict';
// <core.js>
// Pure logic shared by swe.html. No DOM, no I/O, no clock.
// Mirror of backend-plugin/db.py (spec_readiness); vectors/readiness.json, generated
// from the Python side, keeps the two in step. After editing, run `node swe-suite/build.mjs`
// to re-embed this file into swe.html.
const SweCore = (() => {
  const READY_KINDS = ['feature', 'story'];
  const MAX_READY_ESTIMATE = 5;
  const ESTIMATES = [1, 2, 3, 5, 8, 13];

  /** Definition of Ready: can this node be committed to an hour? `criteria_json` is a JSON string. */
  function readiness({ kind, criteria_json, estimate }) {
    if (!READY_KINDS.includes(kind)) return { applies: false, ready: true, checks: [] };
    let parsed;
    try { parsed = criteria_json ? JSON.parse(criteria_json) : []; } catch { parsed = null; }
    const valid = Array.isArray(parsed) && parsed.length > 0 && parsed.every((c) => typeof c === 'string' && c.trim() !== '');
    const hasEstimate = estimate !== null && estimate !== undefined;
    const checks = [
      { name: 'criteria', passed: valid, detail: valid ? `${parsed.length} acceptance criteria` : 'needs at least one acceptance criterion' },
      { name: 'estimate', passed: hasEstimate, detail: hasEstimate ? `${estimate} points` : 'needs an estimate' },
    ];
    if (hasEstimate) {
      const fits = estimate <= MAX_READY_ESTIMATE;
      checks.push({
        name: 'size', passed: fits,
        detail: fits ? `fits one hour (at most ${MAX_READY_ESTIMATE} points)` : `${estimate} points is too big for one hour; split it to ${MAX_READY_ESTIMATE} or fewer`,
      });
    }
    return { applies: true, ready: checks.every((c) => c.passed), checks };
  }

  const KINDS = ['theme', 'epic', 'feature', 'story'];
  const STATUSES = ['draft', 'ready', 'converted'];  // what an edit may set; files may hold others (e.g. "approved")
  const DEFAULT_LIMITS = { text: 20000, criteria: 100 };
  const ID_PATTERN = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;  // an id becomes a filename, so no separators

  /** Why a spec node file is invalid, or null. Does not check the filename, duplicates or parent. */
  function validateNode(n, limits = DEFAULT_LIMITS) {
    if (!n || typeof n !== 'object' || Array.isArray(n)) return 'not an object';
    if (typeof n.id !== 'string' || !n.id) return 'missing id';
    if (!ID_PATTERN.test(n.id) || n.id.length > 200) return 'invalid id';
    if (!KINDS.includes(n.kind)) return `invalid kind ${JSON.stringify(n.kind)}`;
    if (typeof n.title !== 'string' || !n.title.trim() || n.title.length > limits.text) return 'invalid title';
    if (n.parent_id != null && typeof n.parent_id !== 'string') return 'invalid parent_id';
    if (n.criteria != null && (!Array.isArray(n.criteria) || n.criteria.length > limits.criteria || !n.criteria.every((c) => typeof c === 'string' && c.length <= limits.text))) return 'criteria must be an array of strings';
    if (n.estimate != null && !ESTIMATES.includes(n.estimate)) return `estimate must be one of ${ESTIMATES.join(', ')}`;
    if (n.task_ref != null && (typeof n.task_ref !== 'string' || n.task_ref.length > 200)) return 'task_ref must be a short string';
    return null;
  }

  /** JSON text exactly as Python's json.dumps(value, indent=2, sort_keys=True) + "\n": sorted keys,
   *  non-ASCII escaped. (Keys sort by UTF-16 unit, Python by code point; they differ only for
   *  astral-plane keys, which node files do not use.) Integers only: 1.0 would come back as 1. */
  function canonicalJson(value) {
    const str = (s) => JSON.stringify(s).replace(/[\u007f-\uffff]/g, (c) => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
    const walk = (v, pad) => {
      if (Array.isArray(v)) {
        if (!v.length) return '[]';
        const inner = pad + '  ';
        return '[\n' + v.map((x) => inner + walk(x, inner)).join(',\n') + '\n' + pad + ']';
      }
      if (v && typeof v === 'object') {
        const keys = Object.keys(v).sort();
        if (!keys.length) return '{}';
        const inner = pad + '  ';
        return '{\n' + keys.map((k) => inner + str(k) + ': ' + walk(v[k], inner)).join(',\n') + '\n' + pad + '}';
      }
      return typeof v === 'string' ? str(v) : JSON.stringify(v);
    };
    return walk(value, '') + '\n';
  }

  /** A filename-safe id from a title, unique among `taken` (a Set). */
  function newNodeId(title, taken) {
    const base = String(title).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/, '') || 'node';
    let id = base;
    for (let i = 2; taken.has(id); i++) id = `${base}-${i}`;
    return id;
  }

  /** Apply an edit {title, status, estimate, task_ref, criteria} (any subset; null clears estimate/task_ref)
   *  to a node file's object. Returns a new object; throws Error with the reason when it is not allowed. */
  function applyEdit(src, edit, limits = DEFAULT_LIMITS) {
    const next = { ...src };
    if ('title' in edit) next.title = String(edit.title).trim();
    if ('criteria' in edit) next.criteria = edit.criteria.map((c) => String(c).trim()).filter(Boolean);
    for (const key of ['estimate', 'task_ref']) {
      if (!(key in edit)) continue;
      if (edit[key] === null || edit[key] === '') delete next[key]; else next[key] = edit[key];
    }
    if ('status' in edit) {
      if (edit.status !== src.status && !STATUSES.includes(edit.status)) throw new Error(`status must be one of ${STATUSES.join(', ')}`);
      next.status = edit.status;
    }
    const bad = validateNode(next, limits);
    if (bad) throw new Error(bad);
    if (next.status === 'ready' && src.status !== 'ready') {
      const r = readiness({ kind: next.kind, criteria_json: JSON.stringify(next.criteria || []), estimate: next.estimate ?? null });
      if (!r.ready) throw new Error('not ready: ' + r.checks.filter((c) => !c.passed).map((c) => c.detail).join('; '));
    }
    return next;
  }

  return { readiness, validateNode, canonicalJson, newNodeId, applyEdit, KINDS, STATUSES, ESTIMATES, MAX_READY_ESTIMATE };
})();
// </core.js>
// ---- constants -------------------------------------------------------------
const TABS = [
  ['mindmap', 'MindMap'], ['roadmap', 'Roadmap'], ['risk', 'Risk & Tradeoffs'], ['flow', 'Flowcharts'],
  ['arch', 'Architecture'], ['digest', 'Spec Digest'], ['scrum', 'Scrum Planning'],
];
const KINDS = SweCore.KINDS;
const KIND_COLOR = { theme: '#c084fc', epic: '#60a5fa', feature: '#34d399', story: '#fbbf24' };
const SUITE_DIR = 'docs/swe';
const LIMITS = { files: 5000, bytes: 1 << 20, nodes: 5000, text: 20000, criteria: 100 };

// ---- storage: path -> async text. Same interface for both openers ----------
// FsStorage via File System Access API; fallback via <input webkitdirectory>.
// `io` ({read, write, remove}, optional) makes the storage writable. Without it (the webkitdirectory
// fallback) the suite is read-only. `fresh` re-reads from disk, since a File taken at open time is a snapshot.
function storageFromFiles(entries, io) { // entries: Map<relPath, File>
  const snapshot = (text) => ({ size: new TextEncoder().encode(text).length, text: async () => text });
  const storage = { read: async (p) => (entries.has(p) ? entries.get(p).text() : null), paths: () => [...entries.keys()], size: (p) => entries.get(p).size };
  storage.fresh = io ? io.read : storage.read;
  if (io) {
    storage.writable = true;
    storage.write = async (p, text) => { await io.write(p, text); entries.set(p, snapshot(text)); };
    storage.remove = async (p) => { await io.remove(p); entries.delete(p); };
  }
  return storage;
}
// Writes through a directory handle: createWritable stages in a swap file and swaps on close, so a failed write leaves the old file.
function fsIo(root) {
  const split = (p) => { const a = p.split('/'); return [a.slice(0, -1), a[a.length - 1]]; };
  const dirFor = async (parts, create) => { let d = root; for (const part of parts) d = await d.getDirectoryHandle(part, { create }); return d; };
  return {
    read: async (p) => {
      const [dir, name] = split(p);
      try { return await (await (await (await dirFor(dir, false)).getFileHandle(name)).getFile()).text(); }
      catch (e) { if (e && e.name === 'NotFoundError') return null; throw e; }
    },
    write: async (p, text) => {
      const [dir, name] = split(p);
      const w = await (await (await dirFor(dir, true)).getFileHandle(name, { create: true })).createWritable();
      await w.write(text); await w.close();
    },
    remove: async (p) => { const [dir, name] = split(p); await (await dirFor(dir, false)).removeEntry(name); },
  };
}
async function walkHandle(dir, prefix, out, depth = 0) {
  // Only descend toward docs/swe so a whole repo is never read.
  for await (const [name, h] of dir.entries()) {
    const p = prefix + name + (h.kind === 'directory' ? '/' : '');
    const inside = p.startsWith(SUITE_DIR + '/'), toward = (SUITE_DIR + '/').startsWith(p);
    if (!inside && !toward) continue;
    if (h.kind === 'directory') { if (depth < 4 && out.size < LIMITS.files) await walkHandle(h, p, out, depth + 1); }
    else if (inside && out.size < LIMITS.files) out.set(p, await h.getFile());
  }
}

// ---- load + validate (fail closed: errors are shown, never a blank view) ---
async function loadSuite(storage) {
  const errors = [];
  const paths = storage.paths();
  // Accept repo root (docs/swe/project.json) or the swe folder itself (project.json).
  let base = null;
  if (paths.includes(SUITE_DIR + '/project.json')) base = SUITE_DIR + '/';
  else if (paths.includes('project.json')) base = '';
  if (base === null) return { errors: [`No ${SUITE_DIR}/project.json found in the opened folder.`], project: null, nodes: [] };

  const parse = async (p) => {
    if (storage.size(p) > LIMITS.bytes) throw new Error('file too large');
    const raw = await storage.read(p);
    return { raw, value: JSON.parse(raw) };
  };
  let project = null;
  try { project = (await parse(base + 'project.json')).value; } catch (e) { errors.push(`project.json: ${e.message}`); }
  if (project && project.schema_version !== 1) errors.push(`project.json: unsupported schema_version ${JSON.stringify(project.schema_version)}`);

  const specPaths = paths.filter((p) => p.startsWith(base + 'spec/') && p.endsWith('.json'));
  if (specPaths.length > LIMITS.nodes) errors.push('too many spec nodes');
  const nodes = [];
  const seen = new Set();
  for (const p of specPaths.slice(0, LIMITS.nodes)) {
    let n, raw;
    try { ({ value: n, raw } = await parse(p)); } catch (e) { errors.push(`${p}: ${e.message}`); continue; }
    const bad = (m) => errors.push(`${p}: ${m}`);
    const invalid = SweCore.validateNode(n, LIMITS);
    if (invalid) { bad(invalid); continue; }
    if (p !== `${base}spec/${n.id}.json`) { bad('id does not match filename'); continue; }
    if (seen.has(n.id)) { bad('duplicate id'); continue; }
    seen.add(n.id);
    const md = await storage.read(p.replace(/\.json$/, '.md'));
    nodes.push(makeNode(n, p, raw, md && md.length <= LIMITS.text ? md : null));
  }
  // structural checks: parent exists, single root, no cycles
  const byId = new Map(nodes.map((n) => [n.id, n]));
  for (const n of nodes) if (n.parent_id != null && !byId.has(n.parent_id)) errors.push(`${n.id}: parent_id ${JSON.stringify(n.parent_id)} not found`);
  const roots = nodes.filter((n) => n.parent_id == null);
  if (nodes.length && roots.length !== 1) errors.push(`expected exactly one root, found ${roots.length}`);
  for (const n of nodes) {
    let cur = n, hops = 0;
    while (cur && cur.parent_id != null && hops++ <= nodes.length) cur = byId.get(cur.parent_id);
    if (hops > nodes.length) { errors.push(`${n.id}: parent cycle`); break; }
  }
  return { errors, project, nodes, base };
}
// A loaded node: the file's fields plus defaults for display, and the untouched source object and text, which edits start from.
function makeNode(src, path, raw, description) {
  return { ...src, criteria: src.criteria || [], description, _src: src, _path: path, _raw: raw };
}

// ---- tree helpers ----------------------------------------------------------
function childrenOf(nodes) {
  const m = new Map();
  for (const n of nodes) { const k = n.parent_id ?? null; (m.get(k) || m.set(k, []).get(k)).push(n); }
  for (const list of m.values()) list.sort((a, b) => a.title.localeCompare(b.title));
  return m;
}
function pathOf(n, byId) { const out = []; for (let c = n, i = 0; c && i < 20; c = byId.get(c.parent_id), i++) out.unshift(c.title); return out.join(' › '); }

// ---- edits: validate (core), check the file is unchanged on disk, write, then update memory ----
// Each action throws an Error whose message is shown to the person; nothing is half-applied.
async function commitNode(storage, path, src, expectedRaw) {
  const current = await storage.fresh(path);
  if (current !== expectedRaw) throw new Error(`${path} changed on disk since it was opened; reopen the folder`);
  const text = SweCore.canonicalJson(src);
  await storage.write(path, text);
  return text;
}
async function editNode(n, edit) {
  const src = SweCore.applyEdit(n._src, edit, LIMITS);
  const raw = await commitNode(state.storage, n._path, src, n._raw);
  const next = makeNode(src, n._path, raw, n.description);
  state.suite.nodes = state.suite.nodes.map((x) => (x.id === n.id ? next : x));
  return next;
}
async function addChild(parent, title) {
  const kind = KINDS[KINDS.indexOf(parent.kind) + 1];
  if (!kind) throw new Error(`a ${parent.kind} cannot have children`);
  const id = SweCore.newNodeId(title, new Set(state.suite.nodes.map((x) => x.id)));
  const src = { id, kind, title: String(title).trim(), parent_id: parent.id, status: 'draft', criteria: [] };
  const invalid = SweCore.validateNode(src, LIMITS);
  if (invalid) throw new Error(invalid);
  const path = `${state.suite.base}spec/${id}.json`;
  const raw = await commitNode(state.storage, path, src, null);
  const node = makeNode(src, path, raw, null);
  state.suite.nodes = [...state.suite.nodes, node];
  return node;
}
async function deleteNode(n) {
  if (n.parent_id == null) throw new Error('the root cannot be deleted');
  if (state.suite.nodes.some((x) => x.parent_id === n.id)) throw new Error('delete or move its children first');
  if ((await state.storage.fresh(n._path)) !== n._raw) throw new Error(`${n._path} changed on disk since it was opened; reopen the folder`);
  await state.storage.remove(n._path);
  const md = n._path.replace(/\.json$/, '.md');
  if (state.storage.paths().includes(md)) await state.storage.remove(md);
  state.suite.nodes = state.suite.nodes.filter((x) => x.id !== n.id);
}

// ---- rendering (textContent only: file contents are untrusted) -------------
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
}
const state = { suite: null, storage: null, tab: 'mindmap', query: '', selected: null };
function render() {
  const tabs = document.getElementById('tabs'); tabs.replaceChildren();
  for (const [key, label] of TABS) tabs.append(el('div', { class: 'tab' + (key === state.tab ? ' active' : ''), onclick: () => { state.tab = key; render(); } }, label));
  const view = document.getElementById('view'); view.replaceChildren();
  const s = state.suite;
  if (!s) { view.append(el('div', { class: 'empty' }, 'Open a repo folder containing docs/swe/ to begin.')); return; }
  for (const e of s.errors) view.append(el('div', { class: 'err', role: 'alert' }, e));
  if (state.tab === 'mindmap') view.append(renderMindmap(s));
  else if (state.tab === 'digest') view.append(renderDigest(s));
  else view.append(el('div', { class: 'empty' }, 'Not in this spike.'));
}
function renderMindmap(s) {
  const byId = new Map(s.nodes.map((n) => [n.id, n]));
  const q = state.query.trim().toLowerCase();
  const list = q ? s.nodes.filter((n) => `${n.kind} ${n.title} ${n.note || ''}`.toLowerCase().includes(q)) : s.nodes;
  const kids = childrenOf(s.nodes);
  const left = el('div', { style: 'display:flex;flex-direction:column;gap:12px;min-width:0' },
    el('input', { type: 'text', placeholder: 'Search…', value: state.query, id: 'q', oninput: (e) => { state.query = e.target.value; render(); const i = document.getElementById('q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }));
  const tree = el('div', { style: 'display:flex;flex-direction:column;gap:2px;overflow:auto' });
  const row = (n, depth) => el('div', { class: 'row' + (state.selected === n.id ? ' sel' : ''), style: `margin-left:${depth * 14}px`, onclick: () => { state.selected = n.id; render(); } },
    q ? el('div', { class: 'path mono' }, pathOf(n, byId)) : null, `${n.title}`);
  if (q) list.forEach((n) => tree.append(row(n, 0)));
  else { const walk = (n, d) => { tree.append(row(n, d)); (kids.get(n.id) || []).forEach((c) => walk(c, d + 1)); }; (kids.get(null) || []).forEach((r) => walk(r, 0)); }
  if (!list.length) tree.append(el('div', { class: 'muted' }, s.nodes.length ? 'No matches.' : 'No spec nodes.'));
  left.append(tree);
  const n = byId.get(state.selected);
  const detail = el('div', { class: 'panel' });
  if (!n) detail.append(el('div', { class: 'muted' }, 'Select a node to see its details.'));
  else detail.append(...nodeDetail(n, byId), ...(state.storage && state.storage.writable ? [editPanel(n)] : []));
  return el('div', { class: 'grid' }, left, detail);
}
function nodeDetail(n, byId) {
  const out = [
    el('div', { class: 'pill mono', style: `color:${KIND_COLOR[n.kind]};border-color:${KIND_COLOR[n.kind]}` }, n.kind),
    el('div', { style: 'font-size:15px;font-weight:600;color:#fff;margin-bottom:6px' }, n.title),
    el('div', { class: 'path mono', style: 'margin-bottom:8px' }, pathOf(n, byId) + (n.status ? `  ·  ${n.status}` : '')),
  ];
  const ready = SweCore.readiness({ kind: n.kind, criteria_json: JSON.stringify(n.criteria), estimate: n.estimate ?? null });
  if (ready.applies) {
    out.push(el('div', { 'data-testid': 'readiness', class: ready.ready ? 'muted' : 'warn' },
      ready.ready ? 'Ready to commit' : 'Not ready: ' + ready.checks.filter((c) => !c.passed).map((c) => c.detail).join('; ')));
  }
  if (n.task_ref) out.push(el('div', { class: 'muted mono' }, `task ${n.task_ref}`));
  if (n.note) out.push(el('div', { class: 'muted' }, n.note));
  if (n.description) out.push(el('pre', {}, n.description));
  if (n.criteria.length) out.push(el('h4', { class: 'muted' }, 'Acceptance criteria'), el('ul', {}, n.criteria.map((c) => el('li', {}, c))));
  const d = n.decision;
  if (d && typeof d === 'object') {
    const opts = Array.isArray(d.options) ? d.options.map((o) => o && o.label).filter((l) => typeof l === 'string') : [];
    out.push(el('div', { style: 'border-top:1px solid #2c2c2c;margin-top:10px;padding-top:10px' },
      el('div', { class: 'muted mono' }, `decision · ${String(d.type)}`),
      el('div', { style: 'font-size:13px;margin:6px 0' }, String(d.prompt ?? '')),
      opts.length ? el('ul', {}, opts.map((o) => el('li', {}, o))) : null,
      d.type === 'slider' ? el('div', { class: 'muted' }, `${d.min}–${d.max}, default ${d.value}`) : null));
  }
  return out;
}
function editPanel(n) {
  const err = el('div', { class: 'err', role: 'alert' });
  const run = (action, done) => async () => {
    err.textContent = '';
    try { await action(); done(); } catch (e) { err.textContent = String(e.message || e); }
  };
  const field = (label, input) => el('label', { style: 'display:flex;flex-direction:column;gap:2px;font-size:11px;color:#999' }, label, input);
  const title = el('input', { type: 'text', 'data-field': 'title', value: n.title });
  const statuses = [...new Set([...SweCore.STATUSES, n.status].filter(Boolean))];
  const status = el('select', { 'data-field': 'status' }, statuses.map((v) => el('option', { value: v, ...(v === n.status ? { selected: '' } : {}) }, v)));
  const estimate = el('select', { 'data-field': 'estimate' }, [el('option', { value: '' }, 'none'),
    ...SweCore.ESTIMATES.map((v) => el('option', { value: String(v), ...(v === n.estimate ? { selected: '' } : {}) }, String(v)))]);
  const taskRef = el('input', { type: 'text', 'data-field': 'task_ref', value: n.task_ref || '' });
  const criteria = el('textarea', { 'data-field': 'criteria', rows: '5', style: 'width:100%;background:#1e1e1e;color:#e6e6e6;border:1px solid #444;border-radius:4px;padding:8px' });
  criteria.value = n.criteria.join('\n');
  const sized = n.kind === 'feature' || n.kind === 'story';
  const save = el('button', { 'data-action': 'save', onclick: run(() => editNode(n, {
    title: title.value, status: status.value, criteria: criteria.value.split('\n'),
    ...(sized ? { estimate: estimate.value ? Number(estimate.value) : null } : {}), task_ref: taskRef.value.trim() || null,
  }), render) }, 'Save');
  const childTitle = el('input', { type: 'text', 'data-field': 'child-title', placeholder: 'New child title' });
  const add = el('button', { 'data-action': 'add', onclick: run(async () => { state.selected = (await addChild(n, childTitle.value)).id; }, render) }, 'Add child');
  let armed = false;
  const del = el('button', { 'data-action': 'delete', onclick: run(async () => {
    if (!armed) { armed = true; del.textContent = 'Confirm delete'; return; }
    await deleteNode(n); state.selected = n.parent_id;
  }, () => { if (armed && !state.suite.nodes.some((x) => x.id === n.id)) render(); }) }, 'Delete');
  return el('div', { 'aria-label': 'Edit', style: 'border-top:1px solid #2c2c2c;margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:8px' },
    el('div', { class: 'muted mono' }, 'edit'),
    field('Title', title), field('Status', status), sized ? field('Estimate (points)', estimate) : null,
    field('Task reference', taskRef), field('Acceptance criteria (one per line)', criteria),
    el('div', { style: 'display:flex;gap:8px' }, save, del),
    KINDS.indexOf(n.kind) < KINDS.length - 1 ? el('div', { style: 'display:flex;gap:8px' }, childTitle, add) : null, err);
}
function renderDigest(s) {
  const kids = childrenOf(s.nodes);
  const root = el('div', { class: 'digest', style: 'max-width:820px' });
  const tag = { theme: 'h2', epic: 'h3', feature: 'h4', story: 'div' };
  const walk = (n) => {
    const head = el(tag[n.kind], n.kind === 'story' ? { style: 'font-size:12px;color:#ddd;margin:8px 0 2px' } : {}, n.title);
    root.append(head);
    if (n.criteria.length) root.append(el('ul', {}, n.criteria.map((c) => el('li', {}, c))));
    (kids.get(n.id) || []).forEach(walk);
  };
  (kids.get(null) || []).forEach(walk);
  if (!s.nodes.length) root.append(el('div', { class: 'muted' }, 'No spec nodes.'));
  return root;
}

// ---- openers ---------------------------------------------------------------
async function openWith(storage, label) {
  const status = document.getElementById('status');
  status.textContent = 'Loading…';
  try {
    state.suite = await loadSuite(storage);
    state.storage = storage;
    state.selected = null;
    status.textContent = `${label} · ${state.suite.nodes.length} spec nodes` + (storage.writable ? ' · editable' : ' · read-only') + (state.suite.errors.length ? ` · ${state.suite.errors.length} problem(s)` : '');
  } catch (e) { state.suite = { errors: [String(e.message || e)], project: null, nodes: [] }; status.textContent = 'Failed to load.'; }
  render();
}
document.getElementById('open').addEventListener('click', async () => {
  if (!window.showDirectoryPicker) { document.getElementById('fallback-input').click(); return; }
  let dir, writable = true;
  try { dir = await window.showDirectoryPicker({ mode: 'readwrite' }); }
  catch (e) {
    if (e && e.name === 'AbortError') return; // user cancelled
    writable = false;
    try { dir = await window.showDirectoryPicker({ mode: 'read' }); } catch { return; }
  }
  const out = new Map();
  await walkHandle(dir, '', out);
  await openWith(storageFromFiles(out, writable ? fsIo(dir) : undefined), dir.name);
});
document.getElementById('fallback-input').addEventListener('change', async (e) => {
  const out = new Map();
  for (const f of e.target.files) {
    const rel = f.webkitRelativePath.split('/').slice(1).join('/'); // drop picked folder name
    if (rel.startsWith('.git/') || rel.includes('node_modules/')) continue;
    if (rel.startsWith(SUITE_DIR + '/') || rel === 'project.json' || rel.startsWith('spec/')) out.set(rel, f);
  }
  const name = e.target.files[0] ? e.target.files[0].webkitRelativePath.split('/')[0] : 'folder';
  await openWith(storageFromFiles(out), name);
});
render();
</script>
